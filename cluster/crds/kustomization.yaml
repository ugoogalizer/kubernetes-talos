patches:
  # The Keycloak CRDs (520 KB / 428 KB at 26.8.2) exceed the 262144-byte last-applied annotation that client-side
  # apply writes, so apply just these server-side. Everything else in this app stays client-side.
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: ".*\\.k8s\\.keycloak\\.org"
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  # Prometheus Operator CRDs (up to ~860 KB each) are also far over the annotation limit. Added as one key so their
  # own annotations (operator.prometheus.io/version, controller-gen) are kept.
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: ".*\\.monitoring\\.coreos\\.com"
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true
