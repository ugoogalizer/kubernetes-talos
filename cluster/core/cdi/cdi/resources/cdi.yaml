# The CDI install itself (reconciled by cdi-operator, cluster/core/cdi/cdi-operator). Upstream cdi-cr.yaml v1.66.1.
apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  config:
    featureGates:
      - HonorWaitForFirstConsumer
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
  # CDI's per-volume pods (importer, upload, clone) must be able to run on maurice, the tainted GPU worker where VM
  # disks live (local-path volumes are tied to their node), like virt-handler (cluster/core/kubevirt/kubevirt).
  workload:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: workload
        operator: Equal
        value: LargeWorkload
        effect: NoSchedule
