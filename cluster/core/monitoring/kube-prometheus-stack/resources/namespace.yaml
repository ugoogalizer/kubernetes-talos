# Privileged: node-exporter needs hostNetwork, hostPID and read-only hostPath mounts of / , /proc and /sys to report
# node CPU/memory/disk/network. Everything else in the namespace runs non-root with the chart's restricted contexts.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
