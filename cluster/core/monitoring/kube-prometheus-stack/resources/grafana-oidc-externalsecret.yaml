# Grafana credentials from Bitwarden: the Keycloak client secret (client "grafana", realm rockyroadrocks) and a
# break-glass local admin password. Set explicitly because the chart would otherwise render a new random admin
# password on every Argo CD render.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: grafana-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .adminPassword }}"
        oidc-client-secret: "{{ .oidcClientSecret }}"
  data:
    - secretKey: oidcClientSecret
      remoteRef:
        key: "0b9e1ee5-b4c1-4445-a1f0-b50800199855"
    - secretKey: adminPassword
      remoteRef:
        key: "a96af923-cd0b-4ec5-844e-b5080019d7b3"
