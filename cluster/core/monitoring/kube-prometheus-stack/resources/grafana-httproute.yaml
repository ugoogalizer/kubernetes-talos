# Grafana UI on the Cilium external-gateway (LAN; not in the Cloudflare tunnel). TLS ends at the gateway (wildcard cert).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  annotations:
    gethomepage.dev/description: Cluster metrics and dashboards
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Network Services
    gethomepage.dev/icon: grafana
    gethomepage.dev/name: Grafana
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - grafana.rockyroad.rocks
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
      # Grafana Live keeps a websocket open; 0s disables Envoy's 15 s default.
      timeouts:
        request: 0s
