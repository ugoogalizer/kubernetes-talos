# Headlamp OIDC settings, loaded as environment variables (chart config.oidc.externalSecret; the chart passes them as
# -oidc-* flags via $(OIDC_...)). Only the client secret comes from Bitwarden; the rest is fixed here. Keycloak client "kubernetes" (realm rockyroadrocks) is shared with
# the API server's OIDC audience (and later kubelogin for kubectl).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: headlamp-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: kubernetes
        OIDC_CLIENT_SECRET: "{{ .clientSecret }}"
        OIDC_ISSUER_URL: https://keycloak.rockyroad.rocks/realms/rockyroadrocks
        OIDC_SCOPES: openid,profile,email,groups
        OIDC_CALLBACK_URL: https://headlamp.rockyroad.rocks/oidc-callback
        OIDC_USE_PKCE: "true"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: "8579ec6b-5e3b-42e1-9aca-b508007565f2"
