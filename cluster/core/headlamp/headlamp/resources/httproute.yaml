# Headlamp on the Cilium external-gateway (LAN; not in the Cloudflare tunnel). TLS ends at the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    gethomepage.dev/description: Cluster and VM web UI
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Network Services
    gethomepage.dev/icon: headlamp
    gethomepage.dev/name: Headlamp
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - headlamp.rockyroad.rocks
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
      # Watches, logs and the VNC/serial consoles are long-lived websockets; 0s disables Envoy's 15 s default.
      timeouts:
        request: 0s
