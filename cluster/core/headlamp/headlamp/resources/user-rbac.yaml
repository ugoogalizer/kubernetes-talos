# Rights for people signed in with Keycloak (Headlamp now, kubectl via kubelogin later). The API server maps the ID
# token's `groups` claim to Kubernetes groups with the prefix "oidc:" (provision/talos/patches-controlplane/oidc.yaml).
#
# Keycloak group vm-operators:
# - read the whole cluster except Secrets: the built-in `view` role (KubeVirt/CDI aggregate their read rules into
#   it) plus `cluster-reader` below for cluster-scoped and other objects `view` leaves out
# - start/stop/restart/pause VMs and open their VNC/serial consoles in namespace vms (RoleBinding in cluster/core/vms/vms)
# - query Prometheus through the API server's service proxy (the plugin's VM graphs)
# No create/update/delete of objects: VM and cluster configuration stays in git.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-vm-operators-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:vm-operators
---
# Read-only view of what `view` leaves out: cluster-scoped objects (nodes, PVs, storage/priority/runtime classes,
# CRDs, webhooks), RBAC objects, leases, Gateway API and the operators' CRDs. RBAC can't say "everything except
# Secrets", so groups are listed and a new CRD group must be added here to be visible. Deliberately NOT included:
# secrets, pods/exec|attach|portforward, serviceaccounts/token, nodes/proxy, subresources.kubevirt.io, any write verb.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-reader
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io, node.k8s.io, scheduling.k8s.io, coordination.k8s.io, events.k8s.io, policy, admissionregistration.k8s.io, rbac.authorization.k8s.io, networking.k8s.io, discovery.k8s.io, apps, batch, autoscaling]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io, cilium.io, cert-manager.io, acme.cert-manager.io, trust.cert-manager.io, external-secrets.io, generators.external-secrets.io, k8s.keycloak.org, gateway.networking.k8s.io, snapshot.storage.k8s.io, monitoring.coreos.com]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [kubevirt.io, cdi.kubevirt.io, instancetype.kubevirt.io, pool.kubevirt.io, migrations.kubevirt.io, snapshot.kubevirt.io, export.kubevirt.io, clone.kubevirt.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-vm-operators-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:vm-operators
---
# Run state and consoles only (subset of KubeVirt's kubevirt.io:edit, v1.9.1). With runStrategy Manual these calls
# don't change the VM spec, so Argo CD sees no drift. Bound per namespace (vms).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vm-operator
rules:
  - apiGroups: [subresources.kubevirt.io]
    resources:
      - virtualmachineinstances/console
      - virtualmachineinstances/vnc
      - virtualmachineinstances/vnc/screenshot
    verbs: [get]
  - apiGroups: [subresources.kubevirt.io]
    resources:
      - virtualmachines/start
      - virtualmachines/stop
      - virtualmachines/restart
      - virtualmachineinstances/pause
      - virtualmachineinstances/unpause
      - virtualmachineinstances/softreboot
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-query
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames:
      - kube-prometheus-stack-prometheus
      - kube-prometheus-stack-prometheus:9090
      - http:kube-prometheus-stack-prometheus:9090
      - kube-prometheus-stack-prometheus:http-web
      - http:kube-prometheus-stack-prometheus:http-web
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-vm-operators-prometheus-query
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-query
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:vm-operators
