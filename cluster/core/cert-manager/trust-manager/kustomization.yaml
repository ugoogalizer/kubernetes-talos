apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: trust-manager

namespace: cert-manager

helmCharts:
  - name: trust-manager
    repo: https://charts.jetstack.io
    releaseName: trust-manager
    version: v0.26.0 # 0.26.0 as at 20261120 https://github.com/cert-manager/trust-manager/releases
    namespace: cert-manager
    valuesFile: ./values.yaml

