bitwarden-sdk-server:
  enabled: true
  image:
    # The ESO chart still bundles sdk-server v0.6.0; v0.8.1 fixes a thread/memory leak on every failed login.
    tag: v0.8.1@sha256:d2266559f57eff819aab5016c565f9e203895850b0d8a1ea8fc340fad34f4a10 # v0.8.1 as at 20261120 https://github.com/external-secrets/bitwarden-sdk-server/releases
    tls:
      # The chart defaults plus an emptyDir for the session state v0.8+ keeps at /home/nonroot/.bitwarden-state
      # (without it every request logs in again, and Bitwarden rate-limits with 429).
      volumeMounts:
        - mountPath: /certs
          name: bitwarden-tls-certs
        - mountPath: /home/nonroot
          name: bitwarden-state
      volumes:
        - name: bitwarden-tls-certs
          secret:
            secretName: bitwarden-tls-certs
            items:
              - key: tls.crt
                path: cert.pem
              - key: tls.key
                path: key.pem
              - key: ca.crt
                path: ca.pem
        - name: bitwarden-state
          emptyDir:
            sizeLimit: 16Mi
revisionHistoryLimit: 1
installCRDs: true
crds:
  createClusterExternalSecret: true
  createClusterSecretStore: true
  createPushSecret: true
  # The CRDs outgrow the 262144-byte last-applied annotation (0.16: ~254 KB, 0.19+: ~365 KB), so they
  # must be applied server-side; the rest of the core app stays client-side.
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  # No conversion webhook is deployed (webhook.create: false); v1 and v1beta1 share a schema and need none.
  conversion:
    enabled: false
# No ClusterExternalSecrets are used; from 2.x processing them also grants the controller
# update/patch on every Namespace. The CRD is still installed.
processClusterExternalSecret: false
processClusterStore: true
processPushSecret: true
createOperator: true
concurrent: 1
serviceAccount:
  create: true
  automount: true
rbac:
  create: true
  servicebindings:
    create: true
serviceMonitor:
  enabled: false
webhook:
  create: false
certController:
  create: false
