apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: reloader

namespace: reloader

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    releaseName: reloader
    namespace: reloader
    version: 2.2.18 # latest stable as at 20261027 # https://artifacthub.io/packages/helm/stakater/reloader
    valuesFile: values.yaml

resources:
  - ./resources/namespace.yaml
