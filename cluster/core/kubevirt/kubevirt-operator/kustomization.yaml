apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kubevirt-operator

# KubeVirt operator (virt-operator) + the KubeVirt CRD + namespace kubevirt (privileged PSS: virt-handler is a
# privileged DaemonSet). The operator deploys virt-api, virt-controller and virt-handler at its own version once the
# KubeVirt CR (cluster/core/kubevirt/kubevirt) exists.
resources:
  # v1.9.1 as at 20261120 https://github.com/kubevirt/kubevirt/releases (1.10.0 was 2 days old; 1.9 supports k8s 1.36)
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-operator.yaml

patches:
  # The KubeVirt CRD (~525 KB) exceeds the client-side last-applied annotation limit.
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kubevirts.kubevirt.io
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: ServerSideApply=true
