apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vms

# The namespace for KubeVirt virtual machines and who may operate them. The VMs themselves and their images are
# not core: they live in cluster/vms/<name>/, one Argo CD app each (ApplicationSet and project vms).
namespace: vms

resources:
  - resources/namespace.yaml
  - resources/vm-operators-rolebinding.yaml
  - resources/network-policy.yaml
