# Baseline: virt-launcher pods run non-root but add capabilities (e.g. NET_BIND_SERVICE) and may not meet every
# restricted rule. warn/audit restricted show what would fail.
apiVersion: v1
kind: Namespace
metadata:
  name: vms
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
