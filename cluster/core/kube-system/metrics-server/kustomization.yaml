apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: metrics-server

namespace: kube-system

# Metrics API (metrics.k8s.io): current CPU/memory per node and pod, for top, the homepage widget and autoscaling.
# Verifies kubelet TLS with the cluster CA (kubelets' serving certs come from it since 20261120, see
# cluster/core/kubelet-serving-cert-approver), so no --kubelet-insecure-tls.
helmCharts:
  - name: metrics-server
    repo: https://kubernetes-sigs.github.io/metrics-server/
    releaseName: metrics-server
    version: 3.14.0 # 3.14.0 as at 20261120 https://artifacthub.io/packages/helm/metrics-server/metrics-server
    namespace: kube-system
    valuesFile: ./values.yaml
