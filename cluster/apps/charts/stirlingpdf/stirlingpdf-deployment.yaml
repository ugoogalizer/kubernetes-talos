# https://docs.stirlingpdf.com/
--- # deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: stirlingpdf
  name: stirlingpdf
#  namespace: stirlingpdf
spec:
  selector:
    matchLabels:
      app: stirlingpdf
  template:
    metadata:
      labels:
        app: stirlingpdf
        app.kubernetes.io/name: stirlingpdf # required for Homepage
    spec:
      containers:
        - name: stirlingpdf
          image:  stirlingtools/stirling-pdf:latest-fat 
          #
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "Australia/Sydney"
          ports:
            - containerPort: 8080
              name: stirlingpdf-http
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
            limits:
              cpu: "250m"
              memory: "750Mi"
          livenessProbe:
            # as per: https://github.com/alam00000/stirlingpdf/blob/main/chart/values.yaml
            httpGet:
              path: /
              port: stirlingpdf-http
            initialDelaySeconds: 180
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: stirlingpdf-http
            initialDelaySeconds: 180
            periodSeconds: 5
          volumeMounts:
            - mountPath: /configs
              name: stirlingpdf-connfig-pv
      volumes:
        - name: stirlingpdf-connfig-pv
          # If this is NFS backed, you may have to add the nolock mount option to the storage class
          persistentVolumeClaim:
            claimName: stirlingpdf-connfig-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stirlingpdf-connfig-pvc
spec:
  storageClassName: managed-nfs-storage-retain
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 1Gi 
---
apiVersion: v1
kind: Service
metadata:
  name: stirlingpdf-http-svc
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: stirlingpdf-http
  selector:
    app: stirlingpdf
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirlingpdf
  namespace: stirlingpdf
  annotations:
    gethomepage.dev/description: "A self-hosted, web-based PDF reader and manager with a focus on simplicity and ease of use."
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Productivity"
    gethomepage.dev/icon: https://raw.githubusercontent.com/stirlingpdf-app/stirlingpdf/refs/heads/main/public/logo.svg
    gethomepage.dev/name: stirlingpdf
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
  hostnames:
    - "stirlingpdf.rockyroad.rocks"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stirlingpdf-http-svc
          port: 8080

